<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial" role="img" aria-label="pi-ladder loop: request to agent, tool calls become evidence, mechanical judge writes append-only events, two axes produce rank and badges, gates control the next tool call">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="url(#bg)"/>
  <text x="32" y="44" fill="#e6edf3" font-size="22" font-weight="700">pi-ladder</text>
  <text x="120" y="44" fill="#8b949e" font-size="15">evidence in → authority out</text>

  <!-- Request -->
  <rect x="32" y="72" width="196" height="64" rx="10" fill="#1f2937" stroke="#30363d"/>
  <text x="130" y="100" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">User request</text>
  <text x="130" y="120" fill="#8b949e" font-size="12" text-anchor="middle">one turn</text>

  <!-- Agent -->
  <rect x="32" y="176" width="196" height="72" rx="10" fill="#1f2937" stroke="#30363d"/>
  <text x="130" y="204" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Coding agent</text>
  <text x="130" y="224" fill="#8b949e" font-size="12" text-anchor="middle">Pi</text>

  <!-- Gate -->
  <rect x="32" y="288" width="196" height="88" rx="10" fill="#1c2533" stroke="#58a6ff"/>
  <text x="130" y="314" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">Gate</text>
  <text x="130" y="334" fill="#c9d1d9" font-size="12" text-anchor="middle">allow · confirm · deny</text>
  <text x="130" y="354" fill="#8b949e" font-size="11" text-anchor="middle">walls never open</text>

  <!-- Tool calls / evidence -->
  <rect x="300" y="288" width="214" height="88" rx="10" fill="#1f2937" stroke="#30363d"/>
  <text x="407" y="314" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Tool calls = evidence</text>
  <text x="407" y="334" fill="#8b949e" font-size="11.5" text-anchor="middle">files written · tests run</text>
  <text x="407" y="352" fill="#8b949e" font-size="11.5" text-anchor="middle">errors · recoveries</text>

  <!-- Judge -->
  <rect x="566" y="288" width="176" height="88" rx="10" fill="#1f2937" stroke="#30363d"/>
  <text x="654" y="314" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Judge</text>
  <text x="654" y="334" fill="#8b949e" font-size="11.5" text-anchor="middle">mechanical, deterministic</text>
  <text x="654" y="352" fill="#8b949e" font-size="11.5" text-anchor="middle">no evidence → no penalty</text>

  <!-- Event log -->
  <rect x="784" y="288" width="164" height="88" rx="10" fill="#1c2533" stroke="#3fb950"/>
  <text x="866" y="314" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">Event log</text>
  <text x="866" y="334" fill="#c9d1d9" font-size="11.5" text-anchor="middle">append-only, fsync</text>
  <text x="866" y="352" fill="#8b949e" font-size="11.5" text-anchor="middle">source of truth</text>

  <!-- Axes -->
  <rect x="566" y="72" width="382" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="588" y="98" fill="#e6edf3" font-size="13" font-weight="700">Two axes</text>
  <rect x="588" y="112" width="164" height="92" rx="8" fill="#1c2533" stroke="#d29922"/>
  <text x="670" y="134" fill="#d29922" font-size="12.5" font-weight="700" text-anchor="middle">yetki (authority)</text>
  <text x="670" y="154" fill="#c9d1d9" font-size="11" text-anchor="middle">earned by clean work</text>
  <text x="670" y="172" fill="#8b949e" font-size="10.5" text-anchor="middle">0 · 5 · 15 · 30 · 50 · 75</text>
  <text x="670" y="188" fill="#8b949e" font-size="10.5" text-anchor="middle">105 · 140</text>
  <rect x="764" y="112" width="164" height="92" rx="8" fill="#1c2533" stroke="#a371f7"/>
  <text x="846" y="134" fill="#a371f7" font-size="12.5" font-weight="700" text-anchor="middle">merit (badges)</text>
  <text x="846" y="154" fill="#c9d1d9" font-size="11" text-anchor="middle">earned by learning</text>
  <text x="846" y="172" fill="#8b949e" font-size="10.5" text-anchor="middle">10 · 25 · 45 · 70 · 100</text>
  <text x="846" y="188" fill="#8b949e" font-size="10.5" text-anchor="middle">Kıvılcım → Bilge</text>

  <!-- Ranks -->
  <rect x="300" y="72" width="214" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="322" y="98" fill="#e6edf3" font-size="13" font-weight="700">Rank ladder</text>
  <g font-size="11.5" fill="#c9d1d9">
    <text x="322" y="122">bronze — reads free</text>
    <text x="322" y="142">silver — project cmds</text>
    <text x="322" y="162">gold — any non-wall cmd</text>
    <text x="322" y="182">diamond 1–5 — install,</text>
    <text x="322" y="200">subagents, skills, no-ask</text>
  </g>

  <!-- Loop arrows -->
  <path d="M 130 136 L 130 172" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 130 248 L 130 284" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 228 332 L 296 332" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 514 332 L 562 332" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 742 332 L 780 332" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 866 284 L 866 240 L 848 240" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 654 240 L 654 284" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 566 180 L 250 180" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 250 300 L 232 300" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Failure path note -->
  <text x="300" y="430" fill="#8b949e" font-size="12">A turn that ends clean and produces new work: authority +1.</text>
  <text x="300" y="450" fill="#8b949e" font-size="12">A turn that self-corrects an error: D (−2), no credit.</text>
  <text x="300" y="470" fill="#8b949e" font-size="12">An error left unfixed: E (−3), gates close for 3 clean turns.</text>
  <text x="300" y="490" fill="#f85149" font-size="12">A wall (SKILL.md, C:/Windows, rm -rf /): deny, at every rank.</text>
  <text x="300" y="516" fill="#8b949e" font-size="11.5">Caps: 3 authority + 3 merit per UTC day, global across sessions.</text>
  <text x="300" y="536" fill="#8b949e" font-size="11.5">Dedup: a work key is request + sorted files + diff fingerprint — session IDs never enter it.</text>
</svg>
